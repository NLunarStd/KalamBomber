<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Menu - KaLam Bomber</title>
    
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px; /* ระยะห่างระหว่างปุ่ม */
            margin-top: 50px;
        }

        .menu-btn {
            width: 200px;
            padding: 15px;
            font-size: 1.2rem;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background-color: #333;
            color: white;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .menu-btn:hover {
            transform: scale(1.05); /* ขยายเมื่อเอาเมาส์ชี้ */
            background-color: #555;
        }

        /* ปุ่ม Logout สีแดงหน่อยเพื่อให้แตกต่าง */
        #logoutBtn {
            background-color: #c0392b;
            margin-top: 20px;
        }
        #logoutBtn:hover {
            background-color: #e74c3c;
        }
        
        h1 {
            font-size: 3rem;
            color: #333;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }
    </style>

    <script type="text/javascript" src="../js/mainmenu.js"></script>
</head>
<body>

    <div id="container" style="text-align: center;">
        <div class="menu-container">
            <h1>KaLam Bomber</h1>

            <button id="playGameBtn" class="menu-btn">
                🎮 Start Game
            </button>

            <button id="leaderboardBtn" class="menu-btn">
                🏆 Leaderboard
            </button>

            <button id="logoutBtn" class="menu-btn">
                🚪 Logout
            </button>
        </div>
    </div>

</body>
</html>
